<title>建設SSW 試験対策</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f5f5;
         font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #333; }
  .box { background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.12); padding: 32px 24px; width: min(360px, calc(100vw - 32px)); box-sizing: border-box; text-align: center; display: none; }
  h1 { font-size: 1.15rem; margin: 0 0 4px; color: #185FA5; }
  .sub { font-size: .8rem; color: #777; margin-bottom: 22px; line-height: 1.5; }
  input { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 12px 14px; border: 2px solid #ddd; border-radius: 10px; outline: none; }
  input:focus { border-color: #185FA5; }
  button { margin-top: 14px; width: 100%; font-size: 1rem; font-weight: bold; padding: 12px; border: none; border-radius: 10px; background: #185FA5; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: #c0392b; font-size: .85rem; margin-top: 10px; min-height: 1.2em; }
  .wait { color: #777; font-size: .9rem; }
</style></head>
<body>
<div class="box" id="box">
  <h1>建設SSW 試験対策</h1>
  <div class="sub">パスワードを入力してください<br>Masukkan kata sandi</div>
  <form id="fm"><input id="pw" type="password" autocomplete="current-password" placeholder="パスワード / Kata sandi">
  <button id="bt" type="submit">ログイン / Masuk</button></form>

</div>
